name: android-build

# Shared build job; started only from the build_*.yml buttons.
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      format:
        description: "apk or appbundle"
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # android/gradle/gradle-daemon-jvm.properties asks for JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # The project's -Xmx8G does not fit a free runner; the user-home file takes precedence.
      - name: Fit Gradle into the runner
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G" > ~/.gradle/gradle.properties

      - name: Materialize config
        env:
          CONFIG_DEV: ${{ secrets.CONFIG_DEV_JSON }}
          CONFIG_PROD: ${{ secrets.CONFIG_PROD_JSON }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          if [ "$FLAVOR" = "prod" ]; then
            printf '%s' "$CONFIG_PROD" > ../.config.prod.json
          else
            printf '%s' "$CONFIG_DEV" > ../.config.dev.json
          fi
          test -s "../.config.${FLAVOR}.json" || { echo "CONFIG_${FLAVOR^^}_JSON secret is empty"; exit 1; }

      - name: Materialize Firebase and release signing (prod)
        if: ${{ inputs.flavor == 'prod' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json || { echo "GOOGLE_SERVICES_JSON secret is empty"; exit 1; }
          mkdir -p android/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystores/prod.keystore
          cat > android/key.properties <<EOF
          storeFile=keystores/prod.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Optional: with the project's debug key a CI dev APK installs over a local dev build.
      - name: Materialize debug keystore (dev)
        if: ${{ inputs.flavor == 'dev' }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p android/keystores
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > android/keystores/debug.keystore
          fi

      - name: Pub get
        run: flutter pub get

      - name: Codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        env:
          FLAVOR: ${{ inputs.flavor }}
          FORMAT: ${{ inputs.format }}
        run: |
          flutter build "$FORMAT" --flavor "$FLAVOR" --release \
            --dart-define-from-file="../.config.${FLAVOR}.json"

      - name: Name the output
        id: out
        env:
          FLAVOR: ${{ inputs.flavor }}
          FORMAT: ${{ inputs.format }}
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$FORMAT" = "appbundle" ]; then
            src="build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab"
            ext=aab
          else
            src="build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk"
            ext=apk
          fi
          name="assettuner-${FLAVOR}-${version}"
          mkdir -p dist
          cp "$src" "dist/${name}.${ext}"
          echo "name=${name}-${ext}" >> "$GITHUB_OUTPUT"
          echo "### ${name}.${ext}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: client/dist/*
          if-no-files-found: error
          retention-days: 7
